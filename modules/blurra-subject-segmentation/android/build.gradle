plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.blurrasubjectsegmentation'
version = '0.1.0'

android {
  namespace "expo.modules.blurrasubjectsegmentation"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'
}
